<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ауа сапасы картасы</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<style>
/* Leaflet үшін қажетті ең аз CSS (сыртқы stylesheet жүктелмейді) */
.leaflet-container{overflow:hidden;position:relative;outline:0;-webkit-tap-highlight-color:transparent;touch-action:none}
.leaflet-pane,.leaflet-tile,.leaflet-layer,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-pane>canvas{position:absolute;left:0;top:0}
.leaflet-tile{visibility:hidden;user-select:none;width:256px;height:256px}
.leaflet-tile-loaded{visibility:inherit}
.leaflet-pane>svg{max-width:none!important;max-height:none!important}
.leaflet-zoom-animated{transform-origin:0 0}
.leaflet-tile-pane{z-index:200}.leaflet-overlay-pane{z-index:400}.leaflet-map-pane{z-index:1}
.leaflet-interactive{cursor:pointer}
.leaflet-marker-pane{z-index:600}.leaflet-marker-icon{position:absolute;left:0;top:0;pointer-events:none}
.lbl{white-space:nowrap;font-size:11px;color:var(--muted);text-shadow:0 0 3px var(--bg),0 0 3px var(--bg);transform:translate(-50%,-50%)}
.lbl.poi{color:var(--text);font-weight:600}
.leaflet-zoom-anim .leaflet-zoom-animated{transition:transform .25s cubic-bezier(0,0,.25,1)}

:root{
  --bg:#f1f3f2;--surface:#fff;--text:#1b1f24;--muted:#5d6672;--line:#dde1e6;--accent:#1da033;--mapbg:#f2efe9;
  --pad-top:env(safe-area-inset-top,0px);--pad-bot:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171b;--surface:#1d2127;--text:#e8eaed;--muted:#9aa3ad;--line:#2d333b;--accent:#58a6ff}}
:root[data-theme="dark"]{--bg:#14171b;--surface:#1d2127;--text:#e8eaed;--muted:#9aa3ad;--line:#2d333b;--accent:#58a6ff}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-top:var(--pad-top);padding-bottom:var(--pad-bot);display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--surface);border-bottom:1px solid var(--line)}
header h1{font-size:17px;margin:0;font-weight:600;flex:1}
.badge{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.badge.live{color:#1a7f43;border-color:#1a7f43}
main{flex:1;min-height:0;display:flex}
aside{width:320px;max-width:100%;overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:16px}
#mapwrap{flex:1;position:relative;min-width:0}
#map{position:absolute;inset:0;background:var(--mapbg)}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 8px;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--bg);border-radius:8px;padding:8px;text-align:center}
.stat b{display:block;font-size:18px}.stat span{font-size:11px;color:var(--muted)}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;border:0;background:transparent;color:var(--text);padding:7px 4px;font:inherit;font-size:13px;cursor:pointer}
.seg button.on{background:var(--accent);color:#fff}
.cat{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:14px;cursor:pointer}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.cat small{margin-left:auto;color:var(--muted)}
#detail{border:1px solid var(--line);border-radius:10px;padding:12px;font-size:14px}
#detail .big{font-size:26px;font-weight:700;line-height:1.1}
#detail dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:10px 0 0}
#detail dt{color:var(--muted)}#detail dd{margin:0;word-break:break-all}
.tip{margin-top:10px;padding:8px 10px;border-radius:8px;background:var(--bg)}
.zoom{position:absolute;right:12px;top:12px;z-index:500;display:flex;flex-direction:column;gap:6px}
.zoom button{width:38px;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:20px;cursor:pointer}
.note{font-size:12px;color:var(--muted)}
/* 2GIS стилі: жасыл акцент, еркін жүзетін панельдер, ашық бежевая карта */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--mapbg:#1c211f}}
:root[data-theme="dark"]{--mapbg:#1c211f}
main{position:relative}
#mapwrap{position:absolute;inset:0}
aside{position:absolute;z-index:700;left:12px;top:12px;bottom:12px;width:332px;border:0;border-radius:16px;box-shadow:0 2px 14px rgba(0,0,0,.18)}
header{border-bottom:0;box-shadow:0 1px 4px rgba(0,0,0,.12);position:relative;z-index:800}
.zoom button{border:0;box-shadow:0 1px 5px rgba(0,0,0,.25);border-radius:10px}
.badge.live{color:var(--accent);border-color:var(--accent)}
#q{width:100%;padding:11px 14px;border-radius:12px;border:0;background:var(--bg);color:var(--text);font:inherit;outline:0}
#q:focus{box-shadow:0 0 0 2px var(--accent)}
@media (max-width:760px){aside{left:0;right:0;top:auto;bottom:0;width:100%;height:42%;border-radius:16px 16px 0 0}}
</style>
</head>
<body>
<header>
  <h1>Ауа сапасы картасы</h1>
  <span class="badge" id="src">…</span>
</header>
<main>
  <aside>
    <input id="q" type="search" placeholder="Іздеу: құрылғы немесе ID">
    <section><div class="stats">
      <div class="stat"><b id="sN">0</b><span>өлшем</span></div>
      <div class="stat"><b id="sT">–</b><span>орт. °C</span></div>
      <div class="stat"><b id="sH">–</b><span>орт. %</span></div>
    </div></section>
    <section><h2>Уақыт аралығы</h2>
      <div class="seg" id="range">
        <button data-h="1">1 сағ</button><button data-h="24" class="on">24 сағ</button><button data-h="168">7 күн</button><button data-h="0">Барлығы</button>
      </div></section>
    <section><h2>Санаттар</h2><div id="cats"></div></section>
    <section><h2>Таңдалған нүкте</h2>
      <div id="detail"><span class="note">Картадан нүктені басыңыз.</span></div></section>
    <p class="note">Сұр нүкте — AQI есептелмеген (мысалы, MQ-135 әлі қосылмаған, mq135_raw = 0).</p>
  </aside>
  <div id="mapwrap">
    <div id="map"></div>
    <div class="zoom"><button id="zi" aria-label="Үлкейту">+</button><button id="zo" aria-label="Кішірейту">−</button><button id="bs" aria-label="Схема" style="font-size:15px">▦</button><button id="loc" aria-label="Деректер орталығы" style="font-size:15px">◎</button></div>
  </div>
</main>

<script>
// ===== Баптау =====
const CFG = {
  API_BASE: '',                               // мысалы: 'https://your-server.kz'
  MEASUREMENTS: '/api/v1/measurements',       // backend GET endpoint (төмендегі келісімшартты қараңыз)
  USE_TILES: true,                            // OSM тайлдары (өз серверіңізде жұмыс істейді)
  CENTER: [43.2500, 76.9450]
};
/* Күтілетін жауап: { items: [ { measurement_id, device_id, temperature_c, humidity_pct, mq135_raw,
   latitude, longitude, gps_accuracy_m, measured_at,
   air_quality: { aqi: 87|null, category: 'moderate'|...|'unknown', recommendation: '...' } } ] }  */

const CATS = [
  {id:'good',label:'Жақсы (0–50)',color:'#2e9e5b',max:50},
  {id:'moderate',label:'Қалыпты (51–100)',color:'#e0b400',max:100},
  {id:'usg',label:'Сезімталдарға зиянды (101–150)',color:'#f08a24',max:150},
  {id:'unhealthy',label:'Зиянды (151–200)',color:'#d93a3a',max:200},
  {id:'very',label:'Өте зиянды (201–300)',color:'#8e44ad',max:300},
  {id:'hazardous',label:'Қауіпті (300+)',color:'#7e0023',max:1e9},
  {id:'unknown',label:'Деректер жоқ',color:'#8a8f98',max:null}
];
const catById = id => CATS.find(c => c.id === id) || CATS[6];
const TIPS = {
  good:'Ауа таза, терезені ашып желдетуге болады.',
  moderate:'Қысқа желдету жеткілікті; жабық бөлмеде ұзақ болмаңыз.',
  usg:'Тыныс жолы ауруы барларға маска киіп, белсенділікті азайту ұсынылады.',
  unhealthy:'Көшеде болу уақытын азайтыңыз, маска/ауа тазартқыш қолданыңыз.',
  very:'Үйде қалыңыз, терезені жауып ауа тазартқыш қолданыңыз.',
  hazardous:'Сыртқа шықпаңыз, қорғаныс құралдарын қолданыңыз.',
  unknown:'Ауа сапасы бағасы жоқ: тек температура мен ылғалдылық көрсетіледі.'
};

// ===== Демо деректер (backend дайын болмаса) =====
function mockData(){
  const out=[], now=Date.now();
  for(let i=0;i<70;i++){
    const raw = i%9===0 ? 0 : Math.round(120+Math.random()*(i>45?900:520));
    const aqi = raw===0 ? null : Math.round(raw/4.2);
    const cat = aqi===null ? 'unknown' : CATS.find(c=>c.max!==null && aqi<=c.max).id;
    out.push({
      measurement_id:'demo-'+i, device_id:'ESP32-001',
      temperature_c:+(18+Math.random()*9).toFixed(1), humidity_pct:+(30+Math.random()*30).toFixed(1),
      mq135_raw:raw,
      latitude:43.245+(Math.random()-.5)*.07+Math.sin(i/9)*.01,
      longitude:76.945+(Math.random()-.5)*.11+Math.cos(i/9)*.015,
      gps_accuracy_m:+(8+Math.random()*90).toFixed(1),
      measured_at:new Date(now-i*22*60000).toISOString(),
      air_quality:{aqi,category:cat,recommendation:TIPS[cat]}
    });
  }
  return out;
}

// ===== Күй =====
let DATA=[], hours=24, active=new Set(CATS.map(c=>c.id)), layer, ring, selected=null;

const map = L.map('map',{zoomControl:false,attributionControl:false}).setView(CFG.CENTER,12).setMaxBounds([[43.10,76.70],[43.40,77.20]]);
if(CFG.USE_TILES){ L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map); }
// Алматының схемалық негізі (жуық координаттар; OSM тайлдары жүктелмесе де жұмыс істейді)
const base = L.layerGroup().addTo(map);
const dk = matchMedia('(prefers-color-scheme: dark)').matches;
L.polygon([[43.10,76.70],[43.10,77.20],[43.175,77.20],[43.175,76.70]],{stroke:false,fillColor:dk?'#2a3228':'#e3e6d5',fillOpacity:1,interactive:false}).addTo(base);
[[[43.2560,76.9535],[43.2560,76.9595],[43.2600,76.9595],[43.2600,76.9535]],
 [[43.2440,76.9620],[43.2440,76.9700],[43.2500,76.9700],[43.2500,76.9620]]]
  .forEach(p=>L.polygon(p,{stroke:false,fillColor:dk?'#2f4a33':'#c9e4bd',fillOpacity:1,interactive:false}).addTo(base));
const ROADS = [
  ['Әл-Фараби даңғ.',[[43.2125,76.8000],[43.2160,76.8600],[43.2200,76.9300],[43.2190,76.9570],[43.2240,77.0000]]],
  ['Достық даңғ.',[[43.2000,76.9585],[43.2190,76.9570],[43.2385,76.9568],[43.2600,76.9560]]],
  ['Абай даңғ.',[[43.2430,76.8700],[43.2400,76.9100],[43.2385,76.9568],[43.2360,77.0100]]],
  ['Сәтбаев к.',[[43.2530,76.8500],[43.2540,76.9100],[43.2550,76.9560],[43.2560,77.0100]]],
  ['Райымбек даңғ.',[[43.2740,76.8500],[43.2720,76.9300],[43.2740,77.0000]]],
  ['Сейфуллин даңғ.',[[43.2400,76.9440],[43.2600,76.9430],[43.2800,76.9420]]]
];
ROADS.forEach(([n,pts])=>{
  L.polyline(pts,{color:dk?'#0f1210':'#d2ccc0',weight:8,lineCap:'round',interactive:false}).addTo(base);
  L.polyline(pts,{color:dk?'#3a403d':'#ffffff',weight:5,lineCap:'round',interactive:false}).addTo(base);
  const mid=pts[Math.floor(pts.length/2)];
  L.marker(mid,{icon:L.divIcon({className:'',html:'<div class="lbl">'+n+'</div>',iconSize:[0,0]}),interactive:false}).addTo(base);
});
[['Республика алаңы',43.2380,76.9456],['Көктөбе',43.2330,76.9760],['Панфилов саябағы',43.2575,76.9566],['Медеу',43.1570,77.0590],['Іле Алатауы ▲',43.1750,76.9500],['АЛМАТЫ',43.2800,76.8600]]
  .forEach(([n,la,lo])=>L.marker([la,lo],{icon:L.divIcon({className:'',html:'<div class="lbl poi">'+n+'</div>',iconSize:[0,0]}),interactive:false}).addTo(base));
layer = L.layerGroup().addTo(map);
document.getElementById('bs').onclick=()=>{map.hasLayer(base)?map.removeLayer(base):base.addTo(map);layer.eachLayer(l=>l.bringToFront&&l.bringToFront());};
document.getElementById('zi').onclick=()=>map.zoomIn();
document.getElementById('zo').onclick=()=>map.zoomOut();
document.getElementById('loc').onclick=()=>fit();

function fmtDate(s){ try{return new Date(s).toLocaleString('kk-KZ',{dateStyle:'short',timeStyle:'short'});}catch(e){return s;} }
function visible(){
  const lim = hours ? Date.now()-hours*3600e3 : 0;
  return DATA.filter(m => new Date(m.measured_at).getTime()>=lim && active.has(m.air_quality?.category||'unknown') && (!Q || (m.device_id+m.measurement_id).toLowerCase().includes(Q)));
}
function avg(a){return a.length?(a.reduce((x,y)=>x+y,0)/a.length).toFixed(1):'–';}

function render(){
  layer.clearLayers(); const v=visible();
  v.forEach(m=>{
    const c=catById(m.air_quality?.category);
    const mk=L.circleMarker([m.latitude,m.longitude],{radius:9,color:'#fff',weight:2,fillColor:c.color,fillOpacity:.92}).addTo(layer);
    mk.on('click',()=>select(m));
  });
  document.getElementById('sN').textContent=v.length;
  document.getElementById('sT').textContent=avg(v.map(m=>m.temperature_c));
  document.getElementById('sH').textContent=avg(v.map(m=>m.humidity_pct));
  renderCats();
}
function renderCats(){
  const win=DATA.filter(m=>!hours||new Date(m.measured_at).getTime()>=Date.now()-hours*3600e3);
  const box=document.getElementById('cats'); box.innerHTML='';
  CATS.forEach(c=>{
    const n=win.filter(m=>(m.air_quality?.category||'unknown')===c.id).length;
    const row=document.createElement('label'); row.className='cat';
    row.innerHTML='<input type="checkbox"'+(active.has(c.id)?' checked':'')+'><span class="dot" style="background:'+c.color+'"></span>'+c.label+'<small>'+n+'</small>';
    row.querySelector('input').onchange=e=>{e.target.checked?active.add(c.id):active.delete(c.id);render();};
    box.appendChild(row);
  });
}
function select(m){
  const aq=m.air_quality||{}, c=catById(aq.category);
  if(ring) map.removeLayer(ring);
  ring=L.circle([m.latitude,m.longitude],{radius:m.gps_accuracy_m||0,color:c.color,weight:1,fillOpacity:.08}).addTo(map);
  const d=document.getElementById('detail');
  d.innerHTML='<div class="big" style="color:'+c.color+'">'+(aq.aqi==null?'—':aq.aqi)+'</div><div>'+c.label+'</div>'+
   '<dl><dt>Температура</dt><dd>'+m.temperature_c+' °C</dd><dt>Ылғалдылық</dt><dd>'+m.humidity_pct+' %</dd>'+
   '<dt>MQ-135 raw</dt><dd>'+m.mq135_raw+'</dd><dt>GPS қателігі</dt><dd>±'+m.gps_accuracy_m+' м</dd>'+
   '<dt>Уақыты</dt><dd>'+fmtDate(m.measured_at)+'</dd><dt>Құрылғы</dt><dd>'+m.device_id+'</dd></dl>'+
   '<div class="tip"></div>';
  d.querySelector('.tip').textContent=aq.recommendation||TIPS[aq.category||'unknown'];
}
function fit(){
  const v=visible(); if(!v.length) return;
  map.fitBounds(L.latLngBounds(v.map(m=>[m.latitude,m.longitude])),{padding:[40,40],maxZoom:16});
}

document.querySelectorAll('#range button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#range button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); hours=+b.dataset.h; render();
});

// ===== Жүктеу =====
async function load(){
  const badge=document.getElementById('src');
  try{
    const ctl=new AbortController(); setTimeout(()=>ctl.abort(),4000);
    const r=await fetch(CFG.API_BASE+CFG.MEASUREMENTS,{signal:ctl.signal});
    if(!r.ok) throw new Error(r.status);
    const j=await r.json(); DATA=j.items||j;
    badge.textContent='Тікелей деректер'; badge.classList.add('live');
  }catch(e){
    DATA=mockData(); badge.textContent='Демо деректер';
  }
  render(); fit();
}
let Q='';
document.getElementById('q').oninput=e=>{Q=e.target.value.trim().toLowerCase();render();};
load();
setInterval(()=>{ if(document.getElementById('src').classList.contains('live')) load(); },60000);
</script>
</body>
</html>
